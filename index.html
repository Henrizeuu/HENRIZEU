<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <script>
    /* =====================================================================
       CONFIGURE AQUI. É o único lugar que você precisa editar.

       - Para tirar um botão: apague o link e deixe "" (vazio). O botão some.
         Vale para Twitch, Kick, Instagram e TikTok.
       - YouTube e Discord são FIXOS: o botão sempre aparece.
         Com o link vazio, ele mostra "Em breve".
         Colando o link, ele fica ativo sozinho.
       - Pode colar o link completo (https://...) ou sem o https://.

       Exemplo:   discord: "https://discord.gg/abc123",
       ===================================================================== */
    var LINKS = {
      twitch:    "https://www.twitch.tv/henrizeu",
      youtube:   "https://www.youtube.com/@henrizeu",
      kick:      "https://kick.com/henrizeu",
      instagram: "https://www.instagram.com/henrizeu/",
      discord:   ""
    };

    /* =====================================================================
       BOTÕES NOVOS
       Para criar um botão, adicione uma linha dentro dos colchetes abaixo,
       no formato:
           { nome: "Nome do botão", link: "https://...", texto: "frase pequena", cor: "#FF8A00" },

       - nome  : obrigatório. É o título do botão.
       - link  : obrigatório. Sem link, o botão não aparece.
       - texto : opcional. A frase pequena embaixo do nome.
                 Sem ela, aparece o endereço do link.
       - cor   : opcional. Cor do quadradinho, em hexadecimal (ex.: "#FF8A00").
                 Sem ela, fica amarelo.
       Não esqueça a vírgula no fim de cada linha.
       Os botões novos aparecem depois do TikTok, antes do Discord.
       Para tirar um botão novo, apague a linha dele.

       Exemplos abaixo: para ativar, apague a linha de abertura e a de
       fechamento do comentário que está em volta deles.
       ===================================================================== */
    var EXTRAS = [
      
      { nome: "Tik Tok", link: "https://www.tiktok.com/@henrizeu_", texto: "Camisetas e mais", cor: "#000000" }
      
    ];
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Henrizeu | Links</title>
  <meta name="description" content="Henrizeu: todos os links oficiais num só lugar.">
  <meta name="theme-color" content="#0B1B3A">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Henrizeu | Links">
  <meta property="og:description" content="Todos os meus links num só lugar.">
  <!-- Para a prévia aparecer ao compartilhar, descomente a linha abaixo e troque pelo
       endereço COMPLETO do seu site (ex.: https://seuusuario.github.io/henrizeu/assets/og-image.png):
  <meta property="og:image" content="https://SEU-ENDERECO/assets/og-image.png">
  -->
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <style>
    :root {
      --navy: #0B1B3A;
      --navy-2: #050D1F;
      --yellow: #FFC400;
      --white: #FFFFFF;
      --muted: #B8C4DB;
      --card: #0F2347;
      --card-hover: #153061;
    }

    * { box-sizing: border-box; }

    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--white);
      background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%) fixed;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Camadas do fundo ---------- */
    .bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .predio { fill: #0E2247; }
    .janela { fill: var(--yellow); opacity: .3; }
    .bolt {
      fill: none;
      stroke: var(--yellow);
      stroke-width: 3;
      stroke-linejoin: round;
      stroke-linecap: round;
      opacity: .5;
      filter: drop-shadow(0 0 6px rgba(255, 196, 0, .7));
    }

    /* clarão do relâmpago */
    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
      transition: opacity .45s ease-out;
      background: radial-gradient(ellipse at var(--fx, 50%) -10%,
                  rgba(255, 226, 120, .5), rgba(255, 196, 0, .1) 45%, transparent 72%);
    }
    .flash.on { opacity: 1; transition: none; }

    /* raios desenhados pelo script */
    #raios {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* ---------- Conteúdo ---------- */
    .page {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 44px 20px 72px;
      text-align: center;
    }

    .logo {
      width: 132px;
      height: 132px;
      border-radius: 30%;
      display: block;
      margin: 0 auto;
      cursor: pointer;
      box-shadow: 0 0 0 3px var(--yellow), 0 0 40px rgba(255, 196, 0, .32);
      transition: filter .15s ease, transform .15s ease;
    }
    .logo.strike {
      filter: brightness(1.25) drop-shadow(0 0 26px rgba(255, 214, 60, .95));
      transform: scale(1.04);
    }

    h1 {
      margin: 24px 0 8px;
      font-family: "Arial Black", Impact, system-ui, sans-serif;
      font-style: italic;
      font-weight: 900;
      font-size: clamp(36px, 10vw, 52px);
      line-height: 1;
      letter-spacing: .01em;
      text-transform: uppercase;
      text-shadow: 3px 3px 0 rgba(0, 0, 0, .45);
      transition: text-shadow .15s ease;
    }
    h1 .zeu { color: var(--yellow); }
    h1.strike {
      text-shadow: 0 0 24px rgba(255, 214, 60, .95), 3px 3px 0 rgba(0, 0, 0, .45);
    }

    .tagline {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--yellow);
      font-weight: 800;
      font-size: .85rem;
      letter-spacing: .42em;
      text-transform: uppercase;
    }
    .tagline span { margin-right: -.42em; }
    .tagline::before,
    .tagline::after {
      content: "";
      width: 38px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--yellow));
    }
    .tagline::after { transform: scaleX(-1); }

    .links {
      list-style: none;
      margin: 30px 0 0;
      padding: 0;
      display: grid;
      gap: 12px;
    }

    .btn {
      --accent: var(--yellow);
      --on-accent: #fff;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, .08);
      border-left: 6px solid var(--accent);
      color: inherit;
      text-decoration: none;
      text-align: left;
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    /* brilho que passa quando o mouse está em cima */
    .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(110deg, transparent 30%, rgba(255, 255, 255, .2) 46%, transparent 62%);
      transform: translateX(-130%);
    }
    .btn:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: 0 10px 26px rgba(0, 0, 0, .4), 0 0 0 1px rgba(255, 196, 0, .35);
    }
    .btn:hover::after {
      transform: translateX(130%);
      transition: transform .7s ease;
    }
    .btn:focus-visible {
      outline: 3px solid var(--yellow);
      outline-offset: 3px;
    }

    .chip {
      flex: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-weight: 900;
      font-size: .95rem;
      letter-spacing: .02em;
      background: var(--accent);
      color: var(--on-accent);
    }

    .text { min-width: 0; }
    .name { display: block; font-weight: 800; font-size: 1.08rem; }
    .handle {
      display: block;
      color: var(--muted);
      font-size: .92rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .arrow {
      margin-left: auto;
      flex: none;
      font-size: 1.4rem;
      color: var(--yellow);
      transition: transform .15s ease;
    }
    .btn:hover .arrow { transform: translateX(4px); }

    /* botão principal (Twitch) */
    .btn.primary {
      background: var(--yellow);
      border-color: var(--yellow);
      color: var(--navy);
    }
    .btn.primary:hover { background: #ffd23d; }
    .btn.primary .handle { color: rgba(11, 27, 58, .75); }
    .btn.primary .arrow { color: var(--navy); }
    .btn.primary .chip { box-shadow: 0 0 0 2px var(--navy); }

    /* cores de cada rede */
    .twitch    { --accent: #9146FF; }
    .youtube   { --accent: #FF0000; }
    .kick      { --accent: #53FC18; --on-accent: #0B1B3A; }
    .instagram { --accent: #E1306C; }
    .tiktok    { --accent: #FE2C55; }
    .discord   { --accent: #5865F2; }

    /* botão ainda sem link */
    .btn.is-soon {
      opacity: .6;
      pointer-events: none;
      cursor: default;
    }
    .soon-tag {
      margin-left: auto;
      flex: none;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 196, 0, .5);
      color: var(--yellow);
      font-size: .78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    footer {
      margin-top: 40px;
      color: var(--muted);
      font-size: .85rem;
    }

    /* ---------- Animações (só para quem não pediu menos movimento) ---------- */
    @media (prefers-reduced-motion: no-preference) {
      .bolt { display: none; }              /* os raios animados entram no lugar */

      .logo { animation: brilho 3.4s ease-in-out infinite; }
      @keyframes brilho {
        0%, 100% { box-shadow: 0 0 0 3px var(--yellow), 0 0 34px rgba(255, 196, 0, .28); }
        50%      { box-shadow: 0 0 0 3px var(--yellow), 0 0 58px rgba(255, 196, 0, .6); }
      }

      .links li {
        opacity: 0;
        transform: translateY(18px);
        animation: subir .6s cubic-bezier(.2, .8, .2, 1) forwards;
        animation-delay: calc(var(--i, 0) * 90ms + 300ms);
      }
      @keyframes subir { to { opacity: 1; transform: none; } }

      .btn.primary { animation: pulso 2.8s ease-in-out 1.4s infinite; }
      @keyframes pulso {
        0%, 100% { box-shadow: 0 0 0 0 rgba(255, 196, 0, 0); }
        50%      { box-shadow: 0 0 30px 2px rgba(255, 196, 0, .45); }
      }

      .janela { animation: piscar var(--d, 4s) ease-in-out infinite; }
      @keyframes piscar {
        0%, 100% { opacity: .08; }
        50%      { opacity: .85; }
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn, .btn::after, .arrow { transition: none; }
      .btn:hover { transform: none; }
      #raios, .flash { display: none; }
    }
  </style>
</head>
<body>

  <!-- Fundo decorativo: prédios -->
  <svg class="bg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMax slice" aria-hidden="true" focusable="false">
    <g id="predios" class="predio">
      <rect x="0"    y="640" width="90"  height="160"/>
      <rect x="100"  y="590" width="70"  height="210"/>
      <rect x="180"  y="660" width="110" height="140"/>

      <rect x="390"  y="620" width="120" height="180"/>
      <rect x="520"  y="580" width="70"  height="220"/>
      <rect x="600"  y="650" width="100" height="150"/>
      <rect x="710"  y="570" width="90"  height="230"/>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="page">
    <img class="logo" src="logo.png" width="132" height="132" alt="Logo do Henrizeu: a letra H com um raio" title="Toque para soltar um raio">

    <h1>Henri<span class="zeu">zeu</span></h1>
    <p class="tagline"><span>Links</span></p>

    <!--
      COMO EDITAR
      Não precisa mexer aqui. Edite só o bloco LINKS, no topo do arquivo:
      - Trocar um link: mude o endereço lá.
      - Tirar um botão (Twitch, Kick, Instagram, TikTok): deixe o link vazio "".
      - YouTube e Discord ficam sempre; vazios, mostram "Em breve".
      - Botão novo: adicione uma linha na lista EXTRAS (também no topo).
    -->
    <ul class="links">
      <li style="--i:0">
        <a class="btn primary twitch" data-rede="twitch" href="https://www.twitch.tv/henrizeu" target="_blank" rel="noopener noreferrer">
          <span class="chip" aria-hidden="true">TW</span>
          <span class="text">
            <span class="name">Twitch</span>

        </a>
      </li>

      <li style="--i:1">
        <a class="btn youtube" data-rede="youtube" href="https://www.youtube.com/@henrizeu" target="_blank" rel="noopener noreferrer">
          <span class="chip" aria-hidden="true">YT</span>
          <span class="text">
            <span class="name">YouTube</span>
            <span class="handle">@henrizeu</span>
          </span>
          <span class="arrow" aria-hidden="true">&rarr;</span>

      </li>

      <li style="--i:2">
        <a class="btn kick" data-rede="kick" href="https://kick.com/henrizeu" target="_blank" rel="noopener noreferrer">
          <span class="chip" aria-hidden="true">KK</span>
          <span class="text">
            <span class="name">Kick</span>
            <span class="handle">kick.com/henrizeu</span>
          </span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>

      <li style="--i:3">
        <a class="btn instagram" data-rede="instagram" href="https://www.instagram.com/henrizeu/" target="_blank" rel="noopener noreferrer">
          <span class="chip" aria-hidden="true">IG</span>
          <span class="text">
            <span class="name">Instagram</span>
            <span class="handle">@henrizeu</span>
          </span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>

      <!-- Atenção: no TikTok o usuário é henrizeu_ (com underline no final) -->
      <li style="--i:4">
        <a class="btn tiktok" data-rede="tiktok" href="https://www.tiktok.com/@henrizeu_" target="_blank" rel="noopener noreferrer">
          <span class="chip" aria-hidden="true">TT</span>
          <span class="text">
            <span class="name">TikTok</span>
            <span class="handle">@henrizeu_</span>
          </span>
          <span class="arrow" aria-hidden="true">&rarr;</span>
        </a>
      </li>

      <!-- Discord: fica "Em breve" até você colar o link em LINKS (no topo do arquivo). -->
      <li style="--i:5">
        <a class="btn discord is-soon" data-rede="discord" href="#" aria-disabled="true" tabindex="-1">
          <span class="chip" aria-hidden="true">DC</span>
          <span class="text">
            <span class="name">Discord</span>
            <span class="handle">Nossa comunidade</span>
          </span>
          <span class="soon-tag">Em breve</span>
        </a>
      </li>
    </ul>

    <footer>&copy; <span id="ano">2026</span> Henrizeu</footer>
  </main>

  <script>
    /* Ano do rodapé */
    document.getElementById('ano').textContent = new Date().getFullYear();

    /* Links: lê o LINKS do topo do arquivo.
       Link vazio = o botão some. Só YouTube e Discord ficam sempre (como "Em breve"). */
    (function () {
      if (typeof LINKS !== 'object' || !LINKS) return;
      var FIXOS = { youtube: true, discord: true };

      function normalizar(v) {
        v = (typeof v === 'string' ? v : '').trim();
        if (!v) return '';
        if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
        try { return new URL(v).href; } catch (e) { return ''; }
      }

      /* texto pequeno embaixo do nome, tirado do próprio link */
      function rotulo(rede, href) {
        try {
          var u = new URL(href);
          var seg = u.pathname.replace(/^\/+|\/+$/g, '').split('/')[0] || '';
          var host = u.hostname.replace(/^www\./, '');
          if (rede === 'instagram') return seg ? '@' + seg.replace(/^@/, '') : host;
          if ((rede === 'tiktok' || rede === 'youtube') && seg.charAt(0) === '@') return seg;
          return host + (seg ? '/' + seg : '');
        } catch (e) { return ''; }
      }

      function trocarFim(a, html) {
        var fim = a.querySelector('.arrow, .soon-tag');
        if (fim) fim.outerHTML = html;
      }

      function ativar(a, rede, href) {
        a.href = href;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.classList.remove('is-soon');
        a.removeAttribute('aria-disabled');
        a.removeAttribute('tabindex');
        trocarFim(a, '<span class="arrow" aria-hidden="true">&rarr;</span>');
        if (rede !== 'discord') {
          var h = a.querySelector('.handle');
          var r = rotulo(rede, href);
          if (h && r) h.textContent = r;
        }
      }

      function desativar(a) {
        a.setAttribute('href', '#');
        a.removeAttribute('target');
        a.classList.add('is-soon');
        a.setAttribute('aria-disabled', 'true');
        a.setAttribute('tabindex', '-1');
        trocarFim(a, '<span class="soon-tag">Em breve</span>');
      }

      var botoes = document.querySelectorAll('.links a[data-rede]');
      for (var i = 0; i < botoes.length; i++) {
        var a = botoes[i];
        var rede = a.getAttribute('data-rede');
        var href = normalizar(LINKS[rede]);
        if (href) ativar(a, rede, href);
        else if (FIXOS[rede]) desativar(a);
        else a.parentNode.parentNode.removeChild(a.parentNode);
      }

      /* botões novos (lista EXTRAS), antes do Discord */
      function iniciais(nome) {
        var letras = Array.from(nome.replace(/\s+/g, ' ').trim());
        var palavras = nome.trim().split(/\s+/);
        var sigla = palavras.length > 1
          ? Array.from(palavras[0])[0] + Array.from(palavras[1])[0]
          : letras.slice(0, 2).join('');
        return sigla.toUpperCase();
      }

      function textoSobre(hex) {
        var h = hex.replace('#', '');
        if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
        var r = parseInt(h.substr(0, 2), 16), g = parseInt(h.substr(2, 2), 16), b = parseInt(h.substr(4, 2), 16);
        return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#0B1B3A' : '#FFFFFF';
      }

      if (typeof EXTRAS !== 'undefined' && Array.isArray(EXTRAS)) {
        var lista = document.querySelector('.links');
        var discordBtn = document.querySelector('.links a[data-rede="discord"]');
        var antes = discordBtn ? discordBtn.parentNode : null;
        for (var k = 0; k < EXTRAS.length; k++) {
          var ex = EXTRAS[k] || {};
          var nome = String(ex.nome || '').trim();
          var url = normalizar(ex.link);
          if (!nome || !url) continue;

          var cor = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(String(ex.cor || '').trim()) ? String(ex.cor).trim() : '';

          var li = document.createElement('li');
          var link = document.createElement('a');
          link.className = 'btn extra';
          link.href = url;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.style.setProperty('--accent', cor || '#FFC400');
          link.style.setProperty('--on-accent', cor ? textoSobre(cor) : '#0B1B3A');

          var chip = document.createElement('span');
          chip.className = 'chip';
          chip.setAttribute('aria-hidden', 'true');
          chip.textContent = iniciais(nome);

          var bloco = document.createElement('span');
          bloco.className = 'text';
          var n = document.createElement('span');
          n.className = 'name';
          n.textContent = nome;
          var hd = document.createElement('span');
          hd.className = 'handle';
          hd.textContent = String(ex.texto || '').trim() || rotulo('extra', url);
          bloco.appendChild(n);
          bloco.appendChild(hd);

          var seta = document.createElement('span');
          seta.className = 'arrow';
          seta.setAttribute('aria-hidden', 'true');
          seta.innerHTML = '&rarr;';

          link.appendChild(chip);
          link.appendChild(bloco);
          link.appendChild(seta);
          li.appendChild(link);
          lista.insertBefore(li, antes);
        }
      }

      /* refaz a ordem da animação de entrada e destaca o primeiro botão ativo */
      var itens = document.querySelectorAll('.links li');
      var primeiro = null;
      for (var j = 0; j < itens.length; j++) {
        itens[j].style.setProperty('--i', j);
        var b = itens[j].querySelector('a');
        if (b) b.classList.remove('primary');
        if (!primeiro && b && !b.classList.contains('is-soon')) primeiro = b;
      }
      if (primeiro) primeiro.classList.add('primary');
    })();

    /* Janelas acesas nos prédios */
    (function () {
      var NS = 'http://www.w3.org/2000/svg';
      var alvo = document.getElementById('janelas');
      if (!alvo) return;
      var predios = document.querySelectorAll('#predios rect');
      for (var i = 0; i < predios.length; i++) {
        var r = predios[i];
        var x = +r.getAttribute('x'), y = +r.getAttribute('y');
        var w = +r.getAttribute('width'), h = +r.getAttribute('height');
        for (var wy = y + 18; wy < y + h - 20; wy += 34) {
          for (var wx = x + 12; wx < x + w - 18; wx += 28) {
            if (Math.random() > 0.32) continue;
            var j = document.createElementNS(NS, 'rect');
            j.setAttribute('class', 'janela');
            j.setAttribute('x', wx);
            j.setAttribute('y', wy);
            j.setAttribute('width', 8);
            j.setAttribute('height', 12);
            j.setAttribute('style', '--d:' + (3 + Math.random() * 4).toFixed(1) + 's;animation-delay:-' + (Math.random() * 6).toFixed(1) + 's');
            alvo.appendChild(j);
          }
        }
      }
    })();

    /* Raios animados */
    (function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var cv = document.getElementById('raios');
      if (!cv || !cv.getContext) return;
      var ctx = cv.getContext('2d');
      var flashEl = document.getElementById('flash');
      var logo = document.querySelector('.logo');
      var titulo = document.querySelector('h1');
      var W = 0, H = 0, raios = [], rodando = false;

      function rnd(a, b) { return a + Math.random() * (b - a); }

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        cv.width = Math.round(W * dpr);
        cv.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      /* quebra a reta em zigue-zague (deslocamento do ponto do meio) */
      function deslocar(pts, desl, voltas) {
        for (var i = 0; i < voltas; i++) {
          var novo = [pts[0]];
          for (var j = 0; j < pts.length - 1; j++) {
            var p = pts[j], q = pts[j + 1];
            var dx = q[0] - p[0], dy = q[1] - p[1];
            var len = Math.sqrt(dx * dx + dy * dy) || 1;
            var off = (Math.random() - 0.5) * desl;
            novo.push([(p[0] + q[0]) / 2 - dy / len * off, (p[1] + q[1]) / 2 + dx / len * off]);
            novo.push(q);
          }
          pts = novo;
          desl *= 0.55;
        }
        return pts;
      }

      function criar(x0) {
        var x1 = x0 + rnd(-160, 160);
        var y1 = H * rnd(0.35, 0.75);
        var comp = Math.sqrt((x1 - x0) * (x1 - x0) + y1 * y1);
        var principal = deslocar([[x0, -10], [x1, y1]], comp * 0.35, 6);
        var linhas = [{ pts: principal, w: 1 }];
        var n = Math.floor(rnd(2, 5));
        for (var k = 0; k < n; k++) {
          var i = Math.floor(rnd(principal.length * 0.2, principal.length * 0.85));
          var o = principal[i];
          var ang = Math.PI / 2 + rnd(-1.0, 1.0);
          var len = rnd(70, 190);
          var fim = [o[0] + Math.cos(ang) * len, o[1] + Math.sin(ang) * len];
          linhas.push({ pts: deslocar([o, fim], len * 0.4, 4), w: 0.5 });
        }
        return { linhas: linhas, nasc: performance.now(), vida: 750 };
      }

      /* intensidade ao longo da vida do raio: golpe, falha, segundo golpe, some */
      function alfa(t) {
        if (t < 0.10) return 1;
        if (t < 0.20) return 0.25;
        if (t < 0.32) return 0.9;
        return Math.max(0, 0.9 * (1 - (t - 0.32) / 0.68));
      }

      function desenhar(agora) {
        ctx.clearRect(0, 0, W, H);
        raios = raios.filter(function (r) { return agora - r.nasc < r.vida; });
        raios.forEach(function (r) {
          var a = alfa((agora - r.nasc) / r.vida);
          if (a <= 0) return;
          r.linhas.forEach(function (l) {
            ctx.beginPath();
            ctx.moveTo(l.pts[0][0], l.pts[0][1]);
            for (var i = 1; i < l.pts.length; i++) ctx.lineTo(l.pts[i][0], l.pts[i][1]);
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeStyle = 'rgba(255,196,0,' + (a * 0.28) + ')';
            ctx.lineWidth = 14 * l.w;
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,214,70,' + (a * 0.7) + ')';
            ctx.lineWidth = 4.5 * l.w;
            ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,235,' + a + ')';
            ctx.lineWidth = 1.8 * l.w;
            ctx.stroke();
          });
        });
        if (raios.length) {
          requestAnimationFrame(desenhar);
        } else {
          rodando = false;
          ctx.clearRect(0, 0, W, H);
        }
      }

      function clarao(x) {
        if (flashEl) {
          flashEl.style.setProperty('--fx', (x / W * 100) + '%');
          flashEl.classList.add('on');
          setTimeout(function () { flashEl.classList.remove('on'); }, 70);
          setTimeout(function () { flashEl.classList.add('on'); }, 200);
          setTimeout(function () { flashEl.classList.remove('on'); }, 260);
        }
        [logo, titulo].forEach(function (el) {
          if (!el) return;
          el.classList.add('strike');
          setTimeout(function () { el.classList.remove('strike'); }, 380);
        });
      }

      function golpe(x) {
        if (typeof x !== 'number') {
          x = W * (Math.random() < 0.5 ? rnd(0.04, 0.3) : rnd(0.7, 0.96));
        }
        raios.push(criar(x));
        if (!rodando) {
          rodando = true;
          requestAnimationFrame(desenhar);
        }
        clarao(x);
      }

      function agendar(ms) {
        setTimeout(function () {
          if (!document.hidden) {
            golpe();
            if (Math.random() < 0.3) setTimeout(function () { golpe(); }, 160);
          }
          agendar(rnd(2600, 6200));
        }, ms);
      }

      resize();
      window.addEventListener('resize', resize);
      if (logo) {
        logo.addEventListener('click', function () {
          var r = logo.getBoundingClientRect();
          golpe(r.left + r.width / 2);
        });
      }
      agendar(900);
    })();
  </script>
</body>
</html>
